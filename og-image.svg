<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#009624"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Monitor frame -->
  <g transform="translate(600,315)">
    <rect x="-220" y="-160" width="440" height="300" rx="24" fill="#FFFFFF"/>
    <!-- Screen content -->
    <rect x="-190" y="-130" width="380" height="240" rx="12" fill="#00C853" opacity="0.08"/>
    <!-- Header bar -->
    <rect x="-190" y="-130" width="380" height="44" rx="12" fill="#00C853" opacity="0.15"/>
    <circle cx="-165" cy="-108" r="12" fill="#00C853" opacity="0.4"/>
    <rect x="-140" y="-118" width="100" height="20" rx="10" fill="#00C853" opacity="0.25"/>
    <!-- Status bars -->
    <g transform="translate(-160,-60)">
      <rect x="0" y="0" width="16" height="70" rx="4" fill="#00C853"/>
      <rect x="28" y="15" width="16" height="55" rx="4" fill="#00C853"/>
      <rect x="56" y="-5" width="16" height="75" rx="4" fill="#00C853"/>
      <rect x="84" y="20" width="16" height="50" rx="4" fill="#00C853"/>
      <rect x="112" y="5" width="16" height="65" rx="4" fill="#00C853"/>
      <rect x="140" y="-10" width="16" height="80" rx="4" fill="#00C853"/>
      <rect x="168" y="10" width="16" height="60" rx="4" fill="#00C853"/>
      <rect x="196" y="-5" width="16" height="75" rx="4" fill="#00C853"/>
      <rect x="224" y="20" width="16" height="50" rx="4" fill="#00C853"/>
      <rect x="252" y="5" width="16" height="65" rx="4" fill="#00C853"/>
      <rect x="280" y="-15" width="16" height="85" rx="4" fill="#00C853"/>
      <rect x="308" y="10" width="16" height="60" rx="4" fill="#00C853"/>
    </g>
    <!-- Checkmark circle -->
    <circle cx="120" cy="110" r="34" fill="#00C853"/>
    <path d="M102 110 l12 12 l22 -22" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Title text area -->
  <g transform="translate(600,520)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">Gatus — Uptime Monitoring</text>
  </g>
</svg>
