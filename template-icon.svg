<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#009624"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="120" fill="url(#bg)"/>
  <!-- Monitor frame -->
  <g transform="translate(400,380)">
    <rect x="-200" y="-160" width="400" height="280" rx="24" fill="#FFFFFF"/>
    <!-- Screen content -->
    <rect x="-170" y="-130" width="340" height="220" rx="12" fill="#00C853" opacity="0.08"/>
    <!-- Header bar -->
    <rect x="-170" y="-130" width="340" height="40" rx="12" fill="#00C853" opacity="0.15"/>
    <circle cx="-145" cy="-110" r="10" fill="#00C853" opacity="0.4"/>
    <rect x="-125" y="-118" width="80" height="16" rx="8" fill="#00C853" opacity="0.25"/>
    <!-- Status bars -->
    <g transform="translate(-140,-70)">
      <rect x="0" y="0" width="14" height="60" rx="4" fill="#00C853"/>
      <rect x="24" y="15" width="14" height="45" rx="4" fill="#00C853"/>
      <rect x="48" y="-5" width="14" height="65" rx="4" fill="#00C853"/>
      <rect x="72" y="20" width="14" height="40" rx="4" fill="#00C853"/>
      <rect x="96" y="5" width="14" height="55" rx="4" fill="#00C853"/>
      <rect x="120" y="-10" width="14" height="70" rx="4" fill="#00C853"/>
      <rect x="144" y="10" width="14" height="50" rx="4" fill="#00C853"/>
      <rect x="168" y="-5" width="14" height="65" rx="4" fill="#00C853"/>
      <rect x="192" y="20" width="14" height="40" rx="4" fill="#00C853"/>
    </g>
    <!-- Checkmark circle -->
    <circle cx="100" cy="100" r="28" fill="#00C853"/>
    <path d="M86 100 l10 10 l18 -18" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
